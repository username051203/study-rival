name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Debug build — no signing secrets needed at all. Auto-signed with a
  # throwaway debug key, installs and runs identically to a release build.
  # This exists so a working APK is always available even while the release
  # signing secrets (KEYSTORE_BASE64 etc.) aren't set up yet or are broken.
  debug-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.0'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/StudyRival-debug.apk

      - name: Delete old debug release
        run: gh release delete latest-debug --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old debug tag
        run: git push --delete origin latest-debug 2>/dev/null || true

      - name: Create Debug Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: "Study Rival — Latest DEBUG Build (unsigned for release, testing only)"
          body: |
            ⚠️ Debug build — not for Play Store distribution, but installs and runs fine for personal use/testing.

            👉 **[Download StudyRival-debug.apk](https://github.com/${{ github.repository }}/releases/download/latest-debug/StudyRival-debug.apk)**
          files: out/StudyRival-debug.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.0'

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/studyrival.keystore

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace
        env:
          KEYSTORE_PATH: studyrival.keystore
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}

      # Play Store requires an .aab, not an .apk. This doesn't touch the
      # existing APK release flow below — it's a separate artifact for
      # manual upload to Play Console.
      - name: Build Release Bundle (for Play Store)
        run: gradle bundleRelease --stacktrace
        env:
          KEYSTORE_PATH: studyrival.keystore
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyRival-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/StudyRival.apk

      - name: Delete old latest release
        run: gh release delete latest --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old latest tag
        run: git push --delete origin latest 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Study Rival — Latest Build"
          body: |
            👉 **[Download StudyRival.apk](https://github.com/${{ github.repository }}/releases/download/latest/StudyRival.apk)**
          files: out/StudyRival.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
