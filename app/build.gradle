plugins {
    id 'com.android.application'
}

android {
    compileSdk 36
    namespace 'com.studyrival.omega'

    defaultConfig {
        applicationId "com.studyrival.omega"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            // No fallback values here on purpose — this repo is public, so a hardcoded
            // password would be visible to anyone. Local release builds must export
            // these env vars themselves; CI supplies them from GitHub Secrets.
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "studyrival.keystore")
            storePassword System.getenv("KEYSTORE_PASS")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASS")
        }
    }

    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint { abortOnError false }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // Ads
    implementation 'com.google.android.gms:play-services-ads:23.6.0'

    // Room
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
}
